# cargo-audit policy. Every ignored advisory arrives through the pinned LEZ
# dependencies, lee_core for the library and the wallet stack for the runner,
# and is not selectable from this workspace. Revisit on every LEZ pin bump.
[advisories]
ignore = [
    "RUSTSEC-2025-0055", # tracing-subscriber 0.2 ANSI log poisoning, via risc0-zkvm -> lee_core
    "RUSTSEC-2024-0388", # derivative unmaintained, arkworks provenance
    "RUSTSEC-2024-0436", # paste unmaintained, arkworks provenance
    "RUSTSEC-2023-0071", # rsa Marvin timing side channel, via the LEZ wallet stack
    "RUSTSEC-2026-0118", # hickory-proto NSEC3 unbounded loop, via the LEZ wallet stack
    "RUSTSEC-2026-0119", # hickory-proto name compression CPU exhaustion, via the LEZ wallet stack
    "RUSTSEC-2026-0387", # crypto-bigint timing variability, via the LEZ wallet stack
    "RUSTSEC-2025-0141", # bincode 1 unmaintained, via the LEZ wallet stack
    "RUSTSEC-2024-0449", # unsafe-libyaml unmaintained, via the LEZ wallet stack
]
