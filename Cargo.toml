[workspace]
members = ["lez-admin-authority", "lez-admin-authority-macros", "sample", "sample/core", "sample/runner", "sample-minimal"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
borsh = { version = "1", features = ["derive"] }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.4.0-rc3" }
lez-authority = { git = "https://github.com/mmlado/lez-authority", tag = "v0.2.0" }
lez-admin-authority = { path = "lez-admin-authority" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.4.0-rc3" }
program_loader_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.4.0-rc3" }
