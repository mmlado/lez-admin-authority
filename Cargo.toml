[workspace]
members = ["lez-admin-authority"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
borsh = { version = "1", features = ["derive"] }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "7e3f7f765371c4110a1f7f37baf520cd253fb339" }
# Path until lez-authority has a tag to pin.
lez-authority = { path = "../lez-authority" }
lez-admin-authority = { path = "lez-admin-authority" }
